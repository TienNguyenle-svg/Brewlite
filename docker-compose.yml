version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: always
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite123
      POSTGRES_DB: brewlite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
