services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: always
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite123
      POSTGRES_DB: brewlite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brewlite-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: brewlite-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://brewlite:brewlite123@postgres:5432/brewlite?schema=public
      JWT_SECRET: your_super_secret_key
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm exec prisma migrate deploy && pnpm exec prisma db seed && node dist/main"
    networks:
      - brewlite-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: brewlite-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Thêm dòng này để Next.js bind vào 0.0.0.0
      HOSTNAME: "0.0.0.0"
      # THÊM DÒNG NÀY: Giúp Server Component trong Docker gọi được API
      API_URL_INTERNAL: http://backend:3001
    depends_on:
      - backend
    networks:
      - brewlite-network
      
volumes:
  pgdata:

networks:
  brewlite-network:
    driver: bridge