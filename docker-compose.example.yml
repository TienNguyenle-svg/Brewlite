version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: always
    environment:
      POSTGRES_USER: <your_user>
      POSTGRES_PASSWORD: <your_password>
      POSTGRES_DB: <your_db>
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <your_user>"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: