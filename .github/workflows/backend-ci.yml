name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'tests/integration/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/integration/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  statuses: write


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brewlite_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewlite_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewlite_test?schema=public
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9
          cache: 'pnpm'
          cache-dependency-path: './backend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Apply Prisma migrations
        run: pnpm prisma:deploy

      - name: Run Lint
        run: pnpm run lint

      - name: Run Tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js
        env:
          NODE_OPTIONS: --experimental-vm-modules

      - name: Run Integration Tests
        run: pnpm run test:integration:workspace

      - name: Build project
        run: pnpm run build
