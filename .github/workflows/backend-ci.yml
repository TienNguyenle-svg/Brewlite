name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Đảm bảo dòng này có

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: './backend/pnpm-lock.yaml' # Chỉ rõ đường dẫn cache

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-workspace # <-- SỬA DÒNG NÀY

      - name: Run Lint
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test

      - name: Build project
        run: pnpm run build