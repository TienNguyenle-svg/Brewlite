name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main      
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

permissions:      
  contents: read
  statuses: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Run Lint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build