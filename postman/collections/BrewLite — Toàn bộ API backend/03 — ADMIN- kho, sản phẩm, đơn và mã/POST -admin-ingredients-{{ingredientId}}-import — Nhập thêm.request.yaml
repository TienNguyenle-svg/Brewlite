$kind: http-request
name: POST /admin/ingredients/{{ingredientId}}/import — Nhập thêm nguyên liệu
description: Tăng kho thêm amount, không phải đặt lại số tồn.
url: "{{baseUrl}}/admin/ingredients/{{ingredientId}}/import"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 100
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 3000
