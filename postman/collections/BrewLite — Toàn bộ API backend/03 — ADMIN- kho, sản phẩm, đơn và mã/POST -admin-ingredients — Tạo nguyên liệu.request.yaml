$kind: http-request
name: POST /admin/ingredients — Tạo nguyên liệu
description: Tên ngẫu nhiên để tránh trùng; lưu ingredientId từ response.
url: "{{baseUrl}}/admin/ingredients"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Nguyên liệu Postman {{$guid}}",
      "stock": 1000,
      "unit": "gram"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const data = pm.response.json(); if (data.id) pm.collectionVariables.set("ingredientId", data.id); }
    language: text/javascript
order: 2000
