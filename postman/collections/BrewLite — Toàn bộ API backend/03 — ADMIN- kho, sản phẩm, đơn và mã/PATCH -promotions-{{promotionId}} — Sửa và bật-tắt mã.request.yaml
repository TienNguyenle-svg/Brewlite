$kind: http-request
name: PATCH /promotions/{{promotionId}} — Sửa và bật/tắt mã
description: Body mẫu tắt mã. Đổi active=true để bật lại. Không sửa code/type; mã cũ đã lưu trữ ~... có thể không được bật lại. Không có DELETE /promotions/:id trong backend hiện tại.
url: "{{baseUrl}}/promotions/{{promotionId}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "discount": 10,
      "minOrder": 50000,
      "startAt": null,
      "expiredAt": null,
      "usageLimit": 100,
      "active": false
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 15000
