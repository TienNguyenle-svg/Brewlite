$kind: http-request
name: POST /admin/toppings — Tạo topping
url: "{{baseUrl}}/admin/toppings"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Topping Postman {{$guid}}",
      "price": 5000,
      "stock": 100
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const data = pm.response.json(); if (data.id) pm.collectionVariables.set("toppingId", data.id); }
    language: text/javascript
order: 4000
