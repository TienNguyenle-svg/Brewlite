$kind: http-request
name: PATCH /admin/products/{{adminProductId}} — Sửa món test
description: Dùng adminProductId từ request tạo sản phẩm. Không hỗ trợ sửa công thức qua endpoint này.
url: "{{baseUrl}}/admin/products/{{adminProductId}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Cà phê Postman đã sửa {{$guid}}",
      "price": 35000,
      "imageUrl": "/images/hero-1.jpg"
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000
