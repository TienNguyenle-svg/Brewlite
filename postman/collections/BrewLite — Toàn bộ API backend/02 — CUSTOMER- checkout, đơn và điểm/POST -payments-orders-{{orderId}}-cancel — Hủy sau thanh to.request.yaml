$kind: http-request
name: POST /payments/orders/{{orderId}}/cancel — Hủy sau thanh toán lỗi/hết hạn
description: Chỉ CUSTOMER. Luồng hủy khi đơn PAYMENT_FAILED hoặc payment PENDING quá hạn được xử lý thành failed; từ chối nếu còn payment đang hiệu lực. Khác PATCH /orders/:id/cancel. Cần chọn orderId có trạng thái phù hợp.
url: "{{baseUrl}}/payments/orders/{{orderId}}/cancel"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 7000
