$kind: http-request
name: POST /checkout/preview — Xem trước tiền đơn
description: Không tạo đơn. Có thể thêm promotionCode vào JSON để thử mã. usePoints chỉ bật khi tài khoản có đủ điểm.
url: "{{baseUrl}}/checkout/preview"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "size": "M",
          "qty": 1,
          "toppingIds": []
        }
      ],
      "usePoints": false
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 2000
