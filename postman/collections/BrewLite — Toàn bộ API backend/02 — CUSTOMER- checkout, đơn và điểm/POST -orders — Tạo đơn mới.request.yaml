$kind: http-request
name: POST /orders — Tạo đơn mới
description: "Chạy GET /products để có productId. Tạo đơn PENDING, giữ kho. Response tự lưu orderId. Header tự sinh ORD-<số> mới mỗi lần gửi. Muốn thử idempotency: đặt fixedOrderKey=ORD-123456 và giữ nguyên body; bỏ trống lại khi tạo đơn mới. Tiếp tục POST /payments trong cùng folder để tạo lượt thanh toán."
url: "{{baseUrl}}/orders"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: "{{orderIdempotencyKey}}"
    description: Sinh mới mỗi lần gửi; dùng fixedOrderKey để cố ý retry.
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "size": "M",
          "qty": 1,
          "toppingIds": []
        }
      ],
      "receiverName": "Khách kiểm thử Postman",
      "receiverPhone": "0901234567",
      "deliveryAddress": "123 Nguyễn Trãi, Quận 1",
      "usePoints": false
    }
scripts:
  - type: beforeRequest
    code: |-
      const fixed = pm.variables.get("fixedOrderKey");
      const key = fixed || ("ORD-" + Date.now() + Math.floor(Math.random() * 1000000000).toString().padStart(9, "0"));
      if (!/^ORD-\d+$/.test(key)) throw new Error("fixedOrderKey phải có dạng ORD-<số>.");
      pm.variables.set("orderIdempotencyKey", key);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const data = pm.response.json(); if (data.id) pm.collectionVariables.set("orderId", data.id); }
    language: text/javascript
order: 3000
