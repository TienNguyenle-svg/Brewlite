$kind: http-request
name: POST /auth/login — Đăng nhập và tự lưu token theo vai trò
description: Mặc định đăng nhập bằng registerEmail/registerPassword. Muốn đăng nhập ADMIN/BARISTA, sửa loginEmail/loginPassword thành tài khoản đã có vai trò đó. Script lưu authToken và đúng customerToken/adminToken/baristaToken từ user.role. Nếu biến token tương ứng đã có trong environment đang chọn, script đồng bộ biến đó để tránh token cũ ghi đè.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{loginEmail}}",
      "password": "{{loginPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        const key = { CUSTOMER: "customerToken", ADMIN: "adminToken", BARISTA: "baristaToken" }[data.user && data.user.role];
        pm.test("Có JWT và vai trò hợp lệ", function () { pm.expect(data.accessToken).to.be.a("string").and.not.empty; pm.expect(key).to.be.a("string"); });
        if (data.accessToken && key) {
          ["authToken", key].forEach(function (name) {
            pm.collectionVariables.set(name, data.accessToken);
            if (pm.environment.has(name)) pm.environment.set(name, data.accessToken);
          });
        }
      }
    language: text/javascript
order: 2000
