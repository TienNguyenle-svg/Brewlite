$kind: http-request
name: GET /products — Danh sách món đang bán
description: Nếu productId trống, tự lấy ID món đầu tiên. Có thể nhập ID khác trong Variables.
url: "{{baseUrl}}/products?sort=best_seller"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: sort
    value: best_seller
    description: best_seller, price_asc, price_desc hoặc name_asc
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
        const list = pm.response.json();
        pm.test("Danh sách sản phẩm", function () { pm.expect(list).to.be.an("array"); });
        if (!pm.variables.get("productId") && list.length) pm.collectionVariables.set("productId", list[0].id);
      }
    language: text/javascript
order: 3000
