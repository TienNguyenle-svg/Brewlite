$kind: http-request
name: GET /products/{{productId}} — Chi tiết món và topping
description: Chạy GET /products hoặc nhập UUID productId trước. Có thể chọn toppingId từ response để điền toppingIds trong body checkout/order.
url: "{{baseUrl}}/products/{{productId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
