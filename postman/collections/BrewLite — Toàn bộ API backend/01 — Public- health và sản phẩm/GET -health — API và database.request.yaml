$kind: http-request
name: GET /health — API và database
url: "{{baseUrl}}/health"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) pm.test("Database up", function () { pm.expect(pm.response.json().db).to.equal("up"); });
    language: text/javascript
order: 2000
