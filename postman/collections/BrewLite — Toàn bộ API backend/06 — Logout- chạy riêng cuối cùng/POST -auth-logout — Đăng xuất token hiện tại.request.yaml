$kind: http-request
name: POST /auth/logout — Đăng xuất token hiện tại
description: Vô hiệu hóa JWT ở backend. Không chạy cùng các request khác dùng lại token trong bài chịu tải.
url: "{{baseUrl}}/auth/logout"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
