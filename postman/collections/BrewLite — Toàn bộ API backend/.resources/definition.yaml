$kind: collection
description: |-
  # Import và dùng
  Đối chiếu controller/DTO hiện tại: đủ 33 route ứng dụng, mỗi route một request. Bao gồm register, login, logout, tạo payment, IPN và Return. Không thêm Swagger UI /api, API frontend hay endpoint giỏ hàng không có trong backend. DELETE /promotions đã bị gỡ; PATCH dùng để bật/tắt mã.
  1. Import JSON vào Postman. baseUrl mặc định http://localhost:3001; đổi sang URL API Render nếu cần, không có /api hoặc dấu / cuối.
  2. AUTH: sửa registerEmail/registerPassword để đăng ký CUSTOMER mới; hoặc nhập loginEmail/loginPassword của tài khoản đã có rồi gửi POST /auth/login. Script tự lưu authToken và token đúng vai trò (customerToken/adminToken/baristaToken). Các request login/register đều No Auth.
  3. Muốn có đủ 3 vai trò, gửi login lần lượt bằng tài khoản CUSTOMER, ADMIN, BARISTA. Login tự lưu token mỗi role, không xóa token role khác. Đăng ký public không tạo ADMIN/BARISTA. Không chứa thông tin đăng nhập/secret thật; email/mật khẩu mặc định chỉ là mẫu.
  4. Environment có ưu tiên cao hơn Collection Variables. Script login đồng bộ token cùng tên nếu đã có trong Environment. Với ID/baseUrl, xóa hoặc đồng bộ biến trùng tên trong Environment nếu giá trị collection bị ghi đè.
  5. GET /products tự điền productId khi trống. Nếu chưa có món, tạo trong ADMIN theo thứ tự nguyên liệu -> topping nếu cần -> sản phẩm. Request tạo tự lưu ID. adminProductId dành riêng cho món test để sửa/ngừng bán/khôi phục.
  6. CUSTOMER: POST /checkout/preview -> POST /orders -> POST /payments. orderId/paymentId/paymentUrl/paymentAmount/lastPaymentKey tự lưu. Tạo URL payment chưa phải thanh toán thành công; API không tự mở cổng VNPay.
  7. IPN/Return cần query hợp lệ có chữ ký, điền vnpayIpnQuery/vnpayReturnQuery (không dấu ? đầu, giữ nguyên encoding). Collection không chứa secret và không tự tạo chữ ký. Khi chưa có giao dịch/query hợp lệ hãy bỏ chọn callback.
  8. BARISTA: lấy đơn PAID bằng GET /barista/orders, nhập đúng baristaOrderId, gửi lần lượt status PREPARING -> READY -> COMPLETED. Đơn PENDING chưa dùng được luồng barista.
  9. Hủy có hai luồng với điều kiện khác nhau; đọc description của PATCH /orders/:id/cancel và POST /payments/orders/:orderId/cancel trước khi gửi.
  10. POST /auth/logout chạy riêng cuối cùng vì vô hiệu hóa token hiện tại. Mặc định dùng authToken, có thể thay Authorization khi muốn đăng xuất role khác.

  # Runner / Performance
  Đây là danh mục đầy đủ API để chọn gửi request, không phải kịch bản Run All ngay. Mỗi role, hủy/pha chế và callback có điều kiện riêng. Chọn nhóm/request theo kịch bản rồi chạy đúng một lượt trước khi tăng VUs.
  POST /orders sinh ORD-<số> mới; chỉ đặt fixedOrderKey khi test retry cùng nội dung. POST /payments sinh PAY-<tối đa 15 số> mới; đặt fixedPaymentKey=lastPaymentKey để replay cùng lượt đang hiệu lực. Bỏ trống fixedPaymentKey để tạo lượt mới khi hợp lệ.
  Assertion kiểm tra status HTTP; IPN còn kiểm tra RspCode=00 để tránh báo pass khi chữ ký/query sai. Các assertion không thay thế kiểm tra dữ liệu trong integration test.
  Dùng database test có đủ tồn kho; không chạy hàng loạt tạo/sửa/hủy trên dữ liệu thật. Import file không tự gửi request hay thanh toán VNPay.
variables:
