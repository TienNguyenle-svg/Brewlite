  authToken: ""
  customerToken: "{{authToken}}"
  adminToken: ""
  baristaToken: ""
  productId: ""
  adminProductId: ""
  ingredientId: ""
  toppingId: ""
  orderId: ""
  baristaOrderId: ""
  promotionId: ""
  promotionCode: ""
  fixedOrderKey: ""
  orderIdempotencyKey: ""
  newPromotionCode: ""
  vnpayReturnQuery: ""
  registerEmail: postman@example.com
  registerPassword: PostmanTest123!
  loginEmail: "{{registerEmail}}"
  loginPassword: "{{registerPassword}}"
  paymentId: ""
  paymentUrl: ""
  paymentAmount: ""
  lastPaymentKey: ""
  fixedPaymentKey: ""
  paymentIdempotencyKey: ""
